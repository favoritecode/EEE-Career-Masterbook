<!-- EEE Career Masterbook - Blogger Embed Loader -->
<!-- Blogger HTML/JavaScript gadget-এ এই কোড paste করুন। -->
<div id="ecm-embed-wrap" style="width:100%;max-width:100%;margin:0;padding:0;border:0">
  <iframe id="ecm-embed-frame" style="width:100%;height:600px;border:0;display:block;overflow:hidden" allowfullscreen></iframe>
</div>
<script>
(function(){
  var wrap=document.getElementById('ecm-embed-wrap');
  var frame=document.getElementById('ecm-embed-frame');
  if(!wrap||!frame)return;
  var base='https://cdn.jsdelivr.net/gh/favoritecode/EEE-Career-Masterbook@main/blogger-web/';
  fetch(base+'index.html')
    .then(function(r){return r.text();})
    .then(function(html){
      // Inject <base> so relative asset/image paths resolve to the CDN
      html=html.replace('<head>','<head><base href="'+base+'">');
      // Inject into the iframe as an HTML document (not text/plain)
      frame.srcdoc=html;
    })
    .catch(function(){
      // Fallback: point directly (best effort)
      frame.src=base+'index.html';
    });
  // Dark-mode sync: Blogger body.dark → iframe html.dark
  function syncDark(){
    try{
      var dark=document.body.classList.contains('dark');
      frame.contentWindow.postMessage({ecmDark:dark},'*');
    }catch(e){}
  }
  // Send dark state after iframe loads (srcdoc content ready)
  frame.addEventListener('load',function(){setTimeout(syncDark,100);});
  window.addEventListener('load',syncDark);
  if(window.MutationObserver){
    new MutationObserver(syncDark).observe(document.body,{attributes:true,attributeFilter:['class']});
  }
  window.addEventListener('message',function(e){
    if(e.data&&e.data.ecmHeight&&e.source===frame.contentWindow){
      frame.style.height=Math.min(e.data.ecmHeight,20000)+'px';
    }
  });
})();
</script>
